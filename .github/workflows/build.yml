# Builds the installers on GitHub's machines.
# * Run it from the Actions tab: installers appear as downloadable artifacts.
# * A push to main that changes the code or build files builds them too (no release).
# * Push a tag like v1.2.0: it also publishes a GitHub Release with all installers.
#   Installed copies check that repository's latest Release and offer the update.
# Optional code signing for Windows: add repository secrets SIGN_PFX_BASE64 (the .pfx,
# base64-encoded) and SIGN_PFX_PASSWORD.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["**.py", "viewer.html", "pyproject.toml", "uv.lock", ".python-version",
            "packaging/**", "assets/**", ".github/workflows/build.yml"]

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-system   # use the Python from setup-python, never download one

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub's standard Python (version from .python-version): PyInstaller can bundle it
      # everywhere, unlike uv's own downloaded Python on Linux/macOS.
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version }
      - uses: astral-sh/setup-uv@v6
      - name: Stamp version and update source
        run: uv run --no-project python packaging/stamp_version.py "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk python3-dev dpkg-dev curl xvfb
      - run: bash packaging/build_linux.sh
      - run: cd build/installer && sha256sum *.deb *.tar.gz > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with: { name: linux-installer, path: build/installer/* }

  macos:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      # GitHub's standard Python (version from .python-version): PyInstaller can bundle it
      # everywhere, unlike uv's own downloaded Python on Linux/macOS.
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version }
      - uses: astral-sh/setup-uv@v6
      - name: Stamp version and update source
        run: uv run --no-project python packaging/stamp_version.py "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}"
      - run: bash packaging/build_macos.sh
      - run: cd build/installer && shasum -a 256 *.dmg > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with: { name: macos-installer, path: "build/installer/*.dmg\nbuild/installer/SHA256SUMS-macos.txt" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub's standard Python (version from .python-version): PyInstaller can bundle it
      # everywhere, unlike uv's own downloaded Python on Linux/macOS.
      - uses: actions/setup-python@v5
        with: { python-version-file: .python-version }
      - uses: astral-sh/setup-uv@v6
      - name: Stamp version and update source
        run: uv run --no-project python packaging/stamp_version.py "$env:GITHUB_REF_NAME" "$env:GITHUB_REPOSITORY"
      - run: choco install innosetup -y --no-progress
      - name: Decode signing certificate
        env: { SIGN_PFX_BASE64: "${{ secrets.SIGN_PFX_BASE64 }}" }
        if: env.SIGN_PFX_BASE64 != ''
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "SIGN_PFX=$env:RUNNER_TEMP\sign.pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
        env: { SIGN_PFX_PASSWORD: "${{ secrets.SIGN_PFX_PASSWORD }}" }
      - uses: actions/upload-artifact@v4
        with: { name: windows-installer, path: "build/installer/*.exe\nbuild/installer/SHA256SUMS-windows.txt" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
